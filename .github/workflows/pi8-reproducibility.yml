name: HESYCHIA PI8 reproducibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '04_build/**'
      - '03_architecture/**'
      - '.github/workflows/pi8-reproducibility.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 04_build/selective_audio_lab/requirements.txt

      - name: Install dependencies
        working-directory: 04_build/selective_audio_lab
        run: pip install -r requirements.txt

      - name: Contract tests
        working-directory: 04_build/selective_audio_lab
        run: python test_demo.py

      - name: Reproduce PI8 demo
        working-directory: 04_build/selective_audio_lab
        run: |
          python src/run_demo.py --out outputs/demo_run
          python src/latency_benchmark.py --out outputs/latency --runs 40

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: pi8-reproducibility-evidence
          path: |
            04_build/selective_audio_lab/outputs/demo_run/
            04_build/selective_audio_lab/outputs/latency/
          retention-days: 7

name: M4 scientific candidate gates
on:
  pull_request:
    paths:
      - '04_build/selective_audio_lab/src/m4_scientific/**'
      - '04_build/selective_audio_lab/src/m4_science.py'
      - '04_build/selective_audio_lab/test_m4_scientific.py'
      - '04_build/selective_audio_lab/requirements-scientific.txt'
      - '.github/workflows/m4-scientific.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 04_build/selective_audio_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 04_build/selective_audio_lab/requirements-scientific.txt
      - run: python -m pip install -r requirements-scientific.txt
      - run: python -m pytest -q test_m4_scientific.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'

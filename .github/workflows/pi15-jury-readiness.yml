name: PI15 jury-readiness validation
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 04_build/selective_audio_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 04_build/selective_audio_lab/requirements-scientific.txt

      - name: Install pinned scientific environment
        run: python -m pip install -r requirements-scientific.txt

      - name: Compile new PI15 scripts
        run: |
          python -m py_compile src/dsp_class_template.py
          python -m py_compile experiments/pi13_pi14/scripts/pi14_analysis_v2.py
          python -m py_compile experiments/pi13_pi14/scripts/pi14_m4_forward_benchmark.py
          python -m py_compile experiments/pi13_pi14/scripts/pi15_jury_readiness.py
          python -m py_compile experiments/pi13_pi14/scripts/pi15_build_dsp_templates.py
          python -m py_compile experiments/pi13_pi14/scripts/pi15_freeze_external.py
          python -m py_compile experiments/pi13_pi14/scripts/pi15_confirmatory_campaign.py
          python -m py_compile experiments/pi13_pi14/scripts/pi15_local_closure.py

      - name: Existing PI13/PI14 instrumentation tests
        run: python -m pytest -q experiments/pi13_pi14/tests

      - name: Existing M4 scientific engineering tests
        run: python -m pytest -q test_m4_scientific.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'

      - name: DSP class-template smoke and determinism
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import numpy as np
          from src.dsp_class_template import fit_class_templates, save_templates, ClassTemplateDSP
          from src.m4_scientific.model import SR, frontend_contract

          t=np.arange(SR,dtype=np.float32)/SR
          clips={
              0:[np.sin(2*np.pi*300*t).astype(np.float32), np.sin(2*np.pi*340*t).astype(np.float32)],
              1:[np.sin(2*np.pi*1200*t).astype(np.float32), np.sin(2*np.pi*1300*t).astype(np.float32)],
          }
          a=fit_class_templates(clips)
          b=fit_class_templates(clips)
          for k in a:
              assert np.array_equal(a[k],b[k])
              assert np.isfinite(a[k]).all() and a[k].min()>=0 and a[k].max()<=1
          out=Path('experiments/pi13_pi14/ci_evidence/dsp_templates_smoke.npz')
          sha=save_templates(out,a,{'training_pool':'synthetic_ci_only'})
          assert sha==hashlib.sha256(out.read_bytes()).hexdigest()
          dsp=ClassTemplateDSP.from_npz(out)
          mix=(clips[0][0]+clips[1][0]).astype(np.float32)
          m=dsp.predict(mix,0)
          assert m.ndim==2 and m.shape[1]==257
          assert np.allclose(m,m[[0],:])
          assert dsp.metadata['frontend']==frontend_contract()
          g=dsp.gain(m)
          assert g.shape==m.shape and np.isfinite(g).all()
          print({'dsp_sha256':sha,'mask_shape':m.shape,'frontend':dsp.metadata['frontend']})
          PY

      - name: BCa and four-case H1 smoke
        run: |
          mkdir -p experiments/pi13_pi14/ci_evidence
          python - <<'PY'
          import csv,hashlib
          from pathlib import Path
          p=Path('experiments/pi13_pi14/ci_evidence/paired_smoke.csv')
          rows=[]
          for g in range(24):
              sid=f's{g:02d}'; h=hashlib.sha256(sid.encode()).hexdigest(); sp=f'spk{g%4}'
              vals={'CNN':(5.0+g*0.01,0.8),'DSP':(3.0+g*0.01,0.4),'ORACLE':(7.0+g*0.01,0.6)}
              for method,(at,ap) in vals.items():
                  rows.append(dict(scene_id=sid,source_group=f'g{g:02d}',speaker_group=sp,
                      mix_sha256=h,method=method,a_target_db=at,a_protected_db=ap))
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          PY
          python experiments/pi13_pi14/scripts/pi14_analysis_v2.py             --by-scene experiments/pi13_pi14/ci_evidence/paired_smoke.csv             --out experiments/pi13_pi14/ci_evidence/analysis_smoke.json             --boot 2000
          python - <<'PY'
          import json
          p='experiments/pi13_pi14/ci_evidence/analysis_smoke.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['source_group_count']==24
          assert r['speaker_group_count']==4
          assert r['joint_decision']['decision_code']=='REJECT_H0_SELECTIVE_ADVANTAGE'
          assert r['estimands']['cnn_minus_dsp_target_db']['bca_one_sided95']['lower']>0
          assert r['estimands']['cnn_minus_dsp_protected_loss_db']['bca_one_sided95']['upper']<=1
          print(r['joint_decision'])
          PY

      - name: Synthetic end-to-end freeze and confirmatory campaign smoke
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from src.dsp_class_template import fit_class_templates,save_templates
          from src.m4_scientific.corpus import SR

          root=Path('experiments/pi13_pi14/ci_evidence/e2e_smoke')
          pcm=root/'pcm'; pcm.mkdir(parents=True,exist_ok=True)
          t=np.arange(SR*4,dtype=np.float32)/SR

          # Synthetic training material only for DSP code-path validation.
          train={
            0:[(.1*np.sin(2*np.pi*(280+i*8)*t)).astype(np.float32) for i in range(12)],
            1:[(.1*np.sin(2*np.pi*(1100+i*12)*t)).astype(np.float32) for i in range(12)],
          }
          templates=fit_class_templates(train)
          dsp_path=root/'dsp_templates_smoke.npz'
          save_templates(dsp_path,templates,{'training_pool':'synthetic_ci_only'})

          target_fields=['candidate_id','target_class','source_group','pcm_path','pcm_sha256','human_audit_status']
          target_rows=[]
          for i in range(20):
              cls='vacuum_cleaner' if i<10 else 'chainsaw'
              freq=300+i*7 if i<10 else 1200+(i-10)*11
              x=(.12*np.sin(2*np.pi*freq*t)).astype(np.float32)
              p=pcm/f'target_{i:02d}.wav';sf.write(p,x,SR,subtype='FLOAT')
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              target_rows.append(dict(candidate_id=f't{i:02d}',target_class=cls,source_group=f'g{i:02d}',
                    pcm_path=str(p.resolve()),pcm_sha256=h,human_audit_status='ELIGIBLE'))
          tm=root/'targets.csv'
          with tm.open('w',newline='',encoding='utf-8') as fh:
              w=csv.DictWriter(fh,fieldnames=target_fields);w.writeheader();w.writerows(target_rows)

          speech_fields=['candidate_id','speaker_id','source_group','pcm_path','pcm_sha256','human_audit_status']
          speech_rows=[]
          for i in range(4):
              x=(.08*np.sin(2*np.pi*(170+i*25)*t)+.04*np.sin(2*np.pi*(340+i*50)*t)).astype(np.float32)
              p=pcm/f'speech_{i:02d}.wav';sf.write(p,x,SR,subtype='FLOAT')
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              speech_rows.append(dict(candidate_id=f's{i}',speaker_id=f'spk{i}',source_group=f'spk{i}',
                    pcm_path=str(p.resolve()),pcm_sha256=h,human_audit_status='ELIGIBLE'))
          sm=root/'speech.csv'
          with sm.open('w',newline='',encoding='utf-8') as fh:
              w=csv.DictWriter(fh,fieldnames=speech_fields);w.writeheader();w.writerows(speech_rows)

          (root/'kappa.json').write_text(json.dumps({'pairs':93,'cohen_kappa':0.8})+'\n')
          (root/'contamination.json').write_text(json.dumps({'n':93,'ci95':[0.01,0.15]})+'\n')
          PY

          python experiments/pi13_pi14/scripts/pi15_freeze_external.py             --target-manifest experiments/pi13_pi14/ci_evidence/e2e_smoke/targets.csv             --speech-manifest experiments/pi13_pi14/ci_evidence/e2e_smoke/speech.csv             --dsp-templates experiments/pi13_pi14/ci_evidence/e2e_smoke/dsp_templates_smoke.npz             --checkpoint models/m4_sci_real_candidate_v1/selected/candidate.pt             --kappa-report experiments/pi13_pi14/ci_evidence/e2e_smoke/kappa.json             --contamination-report experiments/pi13_pi14/ci_evidence/e2e_smoke/contamination.json             --campaign-script experiments/pi13_pi14/scripts/pi15_confirmatory_campaign.py             --analysis-script experiments/pi13_pi14/scripts/pi14_analysis_v2.py             --dsp-code src/dsp_class_template.py             --dsp-config configs/dsp_class_template_v1.json             --metric-protocol ../../02_plan/PI13_PI14_PREESPECIFICACION_2026-11-08.md             --out experiments/pi13_pi14/ci_evidence/e2e_smoke/freeze.json

          python experiments/pi13_pi14/scripts/pi15_confirmatory_campaign.py             --freeze experiments/pi13_pi14/ci_evidence/e2e_smoke/freeze.json             --out experiments/pi13_pi14/ci_evidence/e2e_smoke/campaign

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/pi13_pi14/ci_evidence/e2e_smoke/campaign')
          a=json.loads((root/'confirmatory_analysis.json').read_text())
          c=json.loads((root/'cp02_report.json').read_text())
          p=json.loads((root/'cp10_report.json').read_text())
          m=json.loads((root/'run_manifest.json').read_text())
          assert a['scene_count']==40 and a['source_group_count']==20 and a['speaker_group_count']==4
          assert c['status']=='COMPLETE' and c['source_group_count']==20
          assert p['status']=='COMPLETE' and p['identical_mix_sha256_for_all_methods'] is True
          assert m['status']=='COMPLETE_DO_NOT_TUNE'
          print({'joint_decision':a['joint_decision'],'cp02_met':c['criterion_met'],'scenes':a['scene_count']})
          PY

      - name: Jury readiness gate is fail-closed before real evidence
        run: |
          set +e
          python experiments/pi13_pi14/scripts/pi15_jury_readiness.py --lab . > experiments/pi13_pi14/ci_evidence/readiness_blocked.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q '"status": "BLOCKED"' experiments/pi13_pi14/ci_evidence/readiness_blocked.json

      - name: M4 real checkpoint benchmark smoke (>=1000 timed blocks)
        run: |
          python experiments/pi13_pi14/scripts/pi14_m4_forward_benchmark.py             --checkpoint models/m4_sci_real_candidate_v1/selected/candidate.pt             --model-src src             --out experiments/pi13_pi14/ci_evidence/m4_runner_benchmark             --runs 100 --warmup 8 --hops 16 --seconds 2             --device cpu --threads 2 --min-samples 1000

      - name: Validate benchmark evidence
        run: |
          python - <<'PY'
          import json
          p='experiments/pi13_pi14/ci_evidence/m4_runner_benchmark/m4_forward_report.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['samples']>=1000
          assert r['block_ms']['p50']<=r['block_ms']['p95']<=r['block_ms']['p99']
          assert r['model_only_rtf']>0
          assert r['checkpoint_sha256']=='c0b34027fe1d4165b062f4145ca7173b3d547cedc39846e17298295e99fb1966'
          print({'samples':r['samples'],'block_ms':r['block_ms'],'rtf':r['model_only_rtf']})
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi15-jury-readiness-evidence
          path: 04_build/selective_audio_lab/experiments/pi13_pi14/ci_evidence/
          if-no-files-found: warn
